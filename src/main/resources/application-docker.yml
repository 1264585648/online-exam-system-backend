server:
  port: 8080
spring:
  main:
    banner-mode: console
    allow-circular-references: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:db_exam}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    database: 0
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
  servlet:
    multipart:
      max-file-size: 5MB
mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: cn.org.alan.exam.model
jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000
  refreshThreshold: 900000
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  accesskey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:online-exam}
coze:
  api:
    base-url: ${COZE_BASE_URL:https://api.coze.cn}
    token: ${COZE_TOKEN:unset}
    bot: ${COZE_BOT:unset}
online-exam:
  chat-platform:
    type: coze
  storage:
    type: minio
  login:
    captcha:
      # Docker baseline disables captcha so the shipped SQL demo accounts can log in.
      # Set CAPTCHA_ENABLED=true to restore the upstream default.
      enabled: ${CAPTCHA_ENABLED:false}
  auto-scoring:
    enabled: false
  agent:
    scoring-enabled: false
    base-url: http://127.0.0.1:8081
system:
  register:
    enabled: true
logging:
  level:
    root: info
